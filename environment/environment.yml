# Same versions as requirements.txt (see the notes there on the PyTorch nightly build).
name: ecg-acf-afib
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/nightly/cu128
      - --pre
      - torch==2.12.0.dev20260304
      - tensorflow==2.19.0
      - ai-edge-litert==2.1.0
      - numpy==2.4.4
      - pandas==3.0.1
      - scipy==1.17.1
      - scikit-learn==1.8.0
      - matplotlib==3.10.8
      - nbconvert==7.17.0
      - ipykernel==7.2.0
